<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>RVFPA 固件资源画像</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <div class="brand-block">
        <span class="brand-mark" aria-hidden="true">RV</span>
        <div>
          <strong>RVFPA</strong>
          <span>RISC-V 固件资源画像</span>
        </div>
      </div>
      <div class="project-switcher">
        <label for="project-select">当前项目</label>
        <select id="project-select" aria-label="当前项目"></select>
        <button id="refresh-button" class="icon-button" title="刷新工作区" aria-label="刷新工作区">↻</button>
        <button id="new-project-button" class="command-button">新建项目</button>
      </div>
      <div class="topbar-actions">
        <span id="service-status" class="status-indicator"><i></i>服务检测中</span>
        <button id="import-button" class="primary-button" disabled>导入固件</button>
      </div>
    </header>

    <aside class="sidebar" aria-label="主导航">
      <nav id="main-navigation">
        <button data-view="overview" class="nav-item active"><span>总览</span><small>资源与诊断</small></button>
        <button data-view="versions" class="nav-item"><span>固件版本</span><small>快照与文件</small></button>
        <button data-view="sections" class="nav-item"><span>段布局</span><small>地址与权限</small></button>
        <button data-view="symbols" class="nav-item"><span>符号分析</span><small>函数与对象</small></button>
        <button data-view="instructions" class="nav-item"><span>指令画像</span><small>类别与扩展</small></button>
        <button data-view="functions" class="nav-item"><span>函数画像</span><small>规模与调用</small></button>
        <button data-view="release" class="nav-item"><span>发布检查</span><small>风险与门禁</small></button>
        <button data-view="policy" class="nav-item"><span>准入策略</span><small>预算与规则</small></button>
        <button data-view="compare" class="nav-item"><span>版本对比</span><small>增长与变化</small></button>
        <button data-view="reports" class="nav-item"><span>报告中心</span><small>导出分析结果</small></button>
        <button data-view="settings" class="nav-item"><span>内存配置</span><small>区域与权限</small></button>
      </nav>
      <div class="sidebar-footer">
        <span>V1.0</span>
        <span id="workspace-label">本地工作区</span>
      </div>
    </aside>

    <main id="main-content" class="main-content" tabindex="-1">
      <div class="page-loading">
        <div class="loading-line"></div>
        <div class="loading-line short"></div>
      </div>
    </main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <template id="empty-project-template">
    <section class="empty-workspace">
      <div class="empty-symbol">RV</div>
      <h1>建立固件分析项目</h1>
      <p>项目用于保存内存区域、固件版本和分析结果。</p>
      <button class="primary-button" data-action="create-project">新建项目</button>
    </section>
  </template>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
